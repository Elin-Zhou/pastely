[package]
name = "cliphub"
version = "0.1.0"
edition = "2021"
description = "Clipboard history manager with fuzzy search popup"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
fuzzy-matcher = "0.3.7"
global-hotkey = "0.9.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
